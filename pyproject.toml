[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylzr"
version = "0.4.0"
description = "Sound-reactive DMX laser controller"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name="Hayden", email="hpeery17@gmail.com" }
]
# Capped at what CI tests and what has prebuilt packages: python-rtmidi has
# none for 3.13+, so installing there means a C++ build that usually fails.
# Raise the cap once python-rtmidi publishes newer wheels.
requires-python = ">=3.11,<3.13"

# Runtime dependencies (minimum versions). uv.lock pins the exact versions
# tested in CI; requirements.txt is exported from it for pip users.
dependencies = [
  "numpy>=1.24",
  "python-rtmidi>=1.5",
  "PyQt5>=5.15",
  "pyqtgraph>=0.13",
  "PyAudio>=0.2.13",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pylzr = "pylzr.__main__:main"

[tool.uv]
# uv.lock is one lock for every OS. PyQt5-Qt5 only has a Windows package for
# 5.15.2, and that version has none for Apple Silicon, so pick per OS.
constraint-dependencies = [
  "pyqt5-qt5==5.15.2; sys_platform == 'win32'",
  "pyqt5-qt5>=5.15.11; sys_platform != 'win32'",
]
# PyAudio has no macOS/Linux packages and is compiled against PortAudio.
# Homebrew's folders (/opt/homebrew on Apple Silicon, /usr/local on Intel)
# aren't on the compiler's default search path; missing folders are ignored.
extra-build-variables = { pyaudio = { CFLAGS = "-I/opt/homebrew/include -I/usr/local/include", LDFLAGS = "-L/opt/homebrew/lib -L/usr/local/lib" } }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]     # run tests without installing the package

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors, bugbear, pyupgrade. Whitespace/alignment
# rules are left off: the code deliberately column-aligns assignments.
select = ["E4", "E7", "E9", "F", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/pylzr/core/text_styles.py" = ["E741"]   # `I` = italic escape code
