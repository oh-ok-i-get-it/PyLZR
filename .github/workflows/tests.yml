name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.deps }} deps
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.12']
        # pinned = requirements.txt (what run.sh / the README install)
        # latest = newest versions allowed by pyproject.toml
        deps: [pinned, latest]
        exclude:
          - python: '3.11'
            deps: latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      # PyAudio has no prebuilt macOS/Linux package; it compiles against PortAudio
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio
          echo "CFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libgl1 libegl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      - name: Install pinned dependencies
        if: matrix.deps == 'pinned'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyLZR
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
