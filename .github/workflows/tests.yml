name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .

  # uv.lock must match pyproject.toml, and requirements.txt must be the
  # current export of uv.lock (see "Changing dependencies" in the README)
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10
      - run: uv lock --check
      - name: requirements.txt is up to date
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.deps }} deps
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.11', '3.12']
        # locked = uv.lock via uv (what `uv run pylzr` installs)
        # latest = newest versions allowed by pyproject.toml, via pip
        #          (the README's pip fallback)
        deps: [locked, latest]
        exclude:
          - python: '3.11'
            deps: latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash   # also on Windows: stops at the first failing command, unlike PowerShell

    steps:
      - uses: actions/checkout@v4

      # PyAudio has no prebuilt macOS/Linux package; it compiles against PortAudio
      - name: System packages (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libgl1 libegl1 libfontconfig1 libxkbcommon0 libdbus-1-3

      # ── locked: uv ────────────────────────────────────────────────────────
      # No CFLAGS/LDFLAGS here on purpose: [tool.uv] extra-build-variables in
      # pyproject.toml must be enough for PyAudio to find Homebrew's PortAudio.
      - name: Install (uv, locked)
        if: matrix.deps == 'locked'
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync locked environment
        if: matrix.deps == 'locked'
        env:
          UV_PYTHON: ${{ matrix.python }}   # overrides .python-version for the 3.11 jobs
        run: uv sync --locked --extra dev

      - name: Run tests (uv)
        if: matrix.deps == 'locked'
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          uv run --no-sync python -c "import sys; assert sys.version.startswith('${{ matrix.python }}.'), sys.version"
          uv run --no-sync pytest -v

      # ── latest: pip ───────────────────────────────────────────────────────
      - name: Install (pip, latest)
        if: matrix.deps == 'latest'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Point the PyAudio build at Homebrew (pip doesn't read [tool.uv])
        if: matrix.deps == 'latest' && runner.os == 'macOS'
        run: |
          echo "CFLAGS=-I$(brew --prefix)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install PyLZR (pip)
        if: matrix.deps == 'latest'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests (pip)
        if: matrix.deps == 'latest'
        run: pytest -v
